name: Build & Stage Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-stage:
    name: Build, Test & Stage on npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm, Node.js & dependencies
        uses: pnpm/setup@v3
        with:
          cache: false
          require-lockfile: false

      - name: Build TypeScript
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Stage package on npm via OIDC
        run: pnpm  stage publish --access public --no-git-checks --loglevel debug
