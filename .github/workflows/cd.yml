name: Build & Stage Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-stage:
    name: Build, Test & Stage on npm
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js & npm
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Build TypeScript
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Stage package on npm via OIDC
        run: npm stage publish --access public --loglevel verbose
